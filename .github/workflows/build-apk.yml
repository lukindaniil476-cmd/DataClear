name: Build DataClear APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q DataClearAndroid.zip
          test -f DataClearAndroid/settings.gradle.kts

      - name: Build APK
        run: |
          cd DataClearAndroid
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DataClear-APK
          path: DataClearAndroid/app/build/outputs/apk/debug/app-debug.apk
